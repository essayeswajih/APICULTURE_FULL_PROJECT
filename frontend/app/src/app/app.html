    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar">

      <div class="offcanvas-header justify-content-between">
        <h4 class="fw-normal text-uppercase fs-6">Menu</h4>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>

      <div class="offcanvas-body">
    
      <ul class="navbar-nav justify-content-end menu-list list-unstyled d-flex flex-column gap-md-3 mb-0">

        <!-- Loop through menu items -->
        <ng-container *ngFor="let item of menuItems">
          
          <!-- Single link item (no submenu) -->
          <li class="nav-item border-dashed" 
              [class.active]="item.active" 
              *ngIf="!item.submenu">
            <a [routerLink]="item.route" 
              class="nav-link d-flex align-items-center gap-3 text-dark p-2"
              routerLinkActive="active">
              <svg width="24" height="24" viewBox="0 0 24 24">
                <use [attr.xlink:href]="item.icon"></use>
              </svg>
              <span>{{ item.label }}</span>
            </a>
          </li>

          <!-- Dropdown item (with submenu) -->
          <li class="nav-item border-dashed" *ngIf="item.submenu">
                <button type="button"
                  class="btn btn-toggle dropdown-toggle position-relative w-100 d-flex justify-content-between align-items-center text-dark p-2"
                  [attr.aria-expanded]="expandedMenuId === item.id"
                  [class.menu-boutique]="item.label === 'Boutique'"
                  (click)="toggleMenu(item.id)">
              <div class="d-flex gap-3 align-items-center">
                <svg width="24" height="24" viewBox="0 0 24 24">
                  <use [attr.xlink:href]="item.icon"></use>
                </svg>
                <span [class.menu-boutique__label]="item.label === 'Boutique'">{{ item.label }}</span>
              </div>
            </button>

            <!-- Collapsible submenu -->
            <div class="collapse" [class.show]="expandedMenuId === item.id">
              <ul class="btn-toggle-nav list-unstyled fw-normal ps-5 pb-1">
                <li class="border-bottom py-2 submenu-item" *ngFor="let sub of item.submenu">
                  <div class="d-flex align-items-center justify-content-between gap-2">
                    <a [routerLink]="sub.route" 
                      [queryParams]="sub.queryParams || {}"
                      class="dropdown-item">
                      {{ sub.label }}
                    </a>
                    <button
                      *ngIf="isEquipementApicultriceLabel(sub.label)"
                      type="button"
                      class="btn btn-link p-0 text-dark subcategory-toggle"
                      (click)="toggleSubmenu(sub.label); $event.preventDefault(); $event.stopPropagation()"
                      [attr.aria-expanded]="expandedSubmenuLabel === sub.label"
                      [attr.aria-label]="expandedSubmenuLabel === sub.label ? 'Fermer les sous-categories' : 'Ouvrir les sous-categories'">
                      <span *ngIf="expandedSubmenuLabel !== sub.label" aria-hidden="true">+</span>
                      <span *ngIf="expandedSubmenuLabel === sub.label" aria-hidden="true">-</span>
                    </button>
                  </div>
                  <ul
                    class="list-unstyled ps-3 small menu-subcategory-list"
                    *ngIf="isEquipementApicultriceLabel(sub.label) && sub.subcategories?.length"
                    [class.is-open]="expandedSubmenuLabel === sub.label">
                    <li *ngFor="let subcat of sub.subcategories">
                      <a [routerLink]="sub.route"
                        [queryParams]="{ category: sub.label, subcategoryId: subcat.id }"
                        class="dropdown-item text-muted">
                        {{ subcat.name }}
                      </a>
                    </li>
                  </ul>
                </li>
              </ul>
            </div>
          </li>

        </ng-container>
      </ul>
      
      </div>

    </div>
<app-header></app-header>
<router-outlet></router-outlet>
<app-footer></app-footer>
