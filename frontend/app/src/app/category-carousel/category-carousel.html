<section id="category-carousel" class="category-carousel py-5 overflow-hidden">
  <div class="container-lg">
    <div class="row">
      <div class="col-md-12">
        <div class="section-header d-flex justify-content-between my-4">
          <h2 class="section-title">Category</h2>
          <div class="d-flex align-items-center">
            <div class="swiper-buttons">
              <button class="category-carousel-prev btn btn-primary">❮</button>
              <button class="category-carousel-next btn btn-primary">❯</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <swiper-container
      [slides-per-view]="5"
      [space-between]="20"
      [breakpoints]="swiperConfig.breakpoints"
      class="mySwiper"
      navigation="true"
      navigation-prev-el=".category-carousel-prev"
      navigation-next-el=".category-carousel-next"
    >
      <swiper-slide *ngFor="let c of categories">
        <div class="category-item text-center">
          <a [href]="c.link || '#'">
            <img [src]="c.image_url" [alt]="c.name || 'Category'" class="rounded-circle mb-2" style="width: 120px; height: 120px;">
            <h4 class="fs-6 fw-normal">{{ c.name }}</h4>
          </a>
        </div>
      </swiper-slide>
    </swiper-container>
  </div>
</section>
