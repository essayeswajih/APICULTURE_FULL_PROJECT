<app-top-bar-carousel></app-top-bar-carousel>

<!--/header> -->
<header class="border-bottom bg-white sticky-top">
  <div class="container-fluid px-3 py-3">

    <!-- MAIN FLEX ROW -->
    <div class="d-flex align-items-center gap-3">

      <!-- 1. LOGO (fixed size) -->
      <div class="flex-shrink-0">
        <a routerLink="/" class="d-block">
          <img src="/assets/logo.png" alt="Logo" height="60" width="60" class="img-fluid">
        </a>
      </div>

      <!-- 2. SEARCH BAR – NOW TAKES ALL FREE SPACE ON LARGE SCREENS -->
      <div class="flex-grow-1 d-flex justify-content-start">
        <div class="search-bar row bg-light p-2 rounded-4 g-0 align-items-center w-100">

          <!-- Category dropdown (≥ md) -->
          <div class="col-md-3 d-none d-md-block pe-0">
            <select class="form-select border-0 bg-transparent"
                    [(ngModel)]="selectedCategory"
                    (change)="onSearchChange()">
              <option value="">All Categories</option>
              <option *ngFor="let category of categories" [value]="category.name">
                {{ category.name }}
              </option>
            </select>
          </div>

          <!-- Search input – takes maximum space -->
          <div class="col-9 col-md-8">
            <form (submit)="search()" class="h-100">
              <input type="text"
                     [(ngModel)]="searchQuery"
                     name="searchQuery"
                     class="form-control border-0 bg-transparent h-100 px-0"
                     placeholder="Rechercher un produit..."
                     (input)="onSearchChange()"
                     required>
            </form>
          </div>

          <!-- Clear button -->
          <div class="col-3 col-md-1 text-end">
            <button *ngIf="products.length > 0" class="btn p-0" (click)="clearSearch()">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="currentColor" d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 3. DESKTOP MENU – appears after search on ≥1500px -->
      <div class="d-none d-xxl-flex align-items-center menu-pc px-4">
        <ul class="navbar-nav d-flex flex-row gap-5 fw-bold text-uppercase mb-0">
          <li class="nav-item">
            <a routerLink="/" routerLinkActive="active-route" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Accueil</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">Boutique</a>
            <ul class="dropdown-menu border-0 shadow p-3 rounded-0 boutique-menu">
              <li *ngFor="let category of categories" class="dropdown-category">

                <!-- CATEGORY (clickable like before) -->
                <a class="dropdown-item fw-bold"
                  [routerLink]="['/boutique']"
                  [queryParams]="{category: category.name}">
                  {{ category.name }}
                </a>

                <!-- 🔥 SUBCATEGORIES -->
                <ul class="list-unstyled ps-3 dropdown-subcategories" *ngIf="category.subcategories?.length">
                  <li *ngFor="let sub of category.subcategories">
                    <a class="dropdown-item text-muted"
                      [routerLink]="['/boutique']"
                      [queryParams]="{category: category.name, subcategoryName: sub.name}"> <!-- mohamed: use subcategoryName in URL -->
                      - {{ sub.name }}
                    </a>
                  </li>
                </ul>

              </li>
            </ul>
          </li>
          <li class="nav-item"><a routerLink="/a-propos" routerLinkActive="active-route" class="nav-link">À Propos</a></li>
          <li class="nav-item"><a routerLink="/contact" routerLinkActive="active-route" class="nav-link">Contact</a></li>
        </ul>
      </div>

      <!-- 4. RIGHT: Mobile Menu + Cart -->
      <div class="d-flex align-items-center gap-3 flex-shrink-0">

        <!-- Mobile menu button (only <1500px) -->
        <button class="navbar-toggler border-0 d-xxl-none"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar">
          <svg width="26" height="26" viewBox="0 0 24 24"><use xlink:href="#menu"></use></svg>
        </button>

        <!-- Cart -->
        <a routerLink="/panier" class="p-2" style="position: relative;">
          <!-- Badge for item count -->
           @if(itemssum > 0){
          <span 
            style="
              position: absolute; 
              top: 5px; 
              right: -3px; 
              background-color: red; 
              border-radius: 50%; 
              width: 18px; 
              height: 18px; 
              display: flex; 
              justify-content: center; 
              align-items: center; 
              color: #fff; 
              font-size: 12px; 
              font-weight: bold; 
              line-height: 1;
            ">
            {{ itemssum }}
          </span>
           }

          
          <!-- Shopping bag icon -->
          <svg width="26" height="26">
            <use xlink:href="#shopping-bag"></use>
          </svg>
        </a>

      </div>

    </div>
  </div>

  <!-- MOBILE OFFCANVAS – Compact version -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" data-bs-backdrop="true" data-bs-scroll="true">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold text-uppercase">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body pt-3 px-3">
      <ul class="list-unstyled">
        <!-- Accueil -->
        <li class="mb-2"> <!-- mohamed: reduced spacing between mobile menu items -->
          <a routerLink="/" class="text-dark text-decoration-none fw-bold" data-bs-dismiss="offcanvas">Accueil</a>
        </li>
        <!-- Boutique with Categories & Subcategories (single button, click to toggle) -->
        <li class="mb-2"> <!-- mohamed: reduced spacing between mobile menu items -->
          <div class="category-hover-menu">
            <button type="button" class="btn btn-link text-dark text-decoration-none d-flex justify-content-between align-items-center w-100 p-0 mobile-boutique-button" (click)="toggleCategoriesMenu()" [attr.aria-expanded]="showCategories">
              <span class="mobile-boutique-button__label">Boutique</span>
              <svg width="20" height="20" style="margin-left:8px;vertical-align:middle;">
                <ng-container *ngIf="!showCategories">
                  <polyline points="5,8 10,13 15,8" fill="none" stroke="#222" stroke-width="2"/>
                </ng-container>
                <ng-container *ngIf="showCategories">
                  <polyline points="5,12 10,7 15,12" fill="none" stroke="#222" stroke-width="2"/>
                </ng-container>
              </svg>
            </button>
            <div class="categories-grid mt-2 p-2 border rounded bg-light" [ngStyle]="{display: showCategories ? 'block' : 'none'}" style="max-height: 400px; overflow-y: auto;">
              <div *ngFor="let category of categories" class="category-item mb-2">
                <div class="d-flex align-items-center justify-content-between mb-1 category-row">
                  <div class="fw-bold text-dark category-name">{{ category.name }}</div>
                  <button
                    *ngIf="isEquipementApicultrice(category)"
                    type="button"
                    class="btn btn-link p-0 text-dark category-toggle"
                    (click)="toggleCategorySubcategories(category.id)"
                    [attr.aria-expanded]="expandedCategoryIds.has(category.id)"
                    [attr.aria-label]="expandedCategoryIds.has(category.id) ? 'Fermer les sous-categories' : 'Ouvrir les sous-categories'">
                    <span *ngIf="!expandedCategoryIds.has(category.id)" aria-hidden="true">+</span>
                    <span *ngIf="expandedCategoryIds.has(category.id)" aria-hidden="true">-</span>
                  </button>
                </div>
                <ul
                  class="list-unstyled ps-3 small subcategory-list"
                  *ngIf="isEquipementApicultrice(category) && category.subcategories?.length"
                  [class.is-open]="expandedCategoryIds.has(category.id)">
                  <!-- mohamed: use subcategoryName in URL -->
                  <li *ngFor="let sub of category.subcategories">
                    <a [routerLink]="['/boutique']"
                      [queryParams]="{category: category.name, subcategoryName: sub.name}" 
                      class="text-muted text-decoration-none"
                      data-bs-dismiss="offcanvas">
                      {{ sub.name }}
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</header>


<!-- Display Products Below the Search Bar -->
<div class="container">
  <div class="row">
    <div *ngFor="let product of products" class="col-12 d-flex align-items-center mb-3" (click)="goToProduct(product.slug ?? '')" style="height: 70px;cursor: pointer">
      <img [src]="product.image_url" alt="Product Image" style="height: 70px; width: auto;" class="me-3">
      <span class="fs-5" >{{ product.name }}</span>
    </div>
  </div>
</div>
