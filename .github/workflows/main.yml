name: CI/CD with Docker Compose

on:
  push:
    branches:
      - main  # Runs when changes are pushed to 'main'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          password: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 49152
          script_stop: true
          script: |
            cd ~/workspace/APICULTURE_FULL_PROJECT
            git pull --ff-only
            docker compose down --remove-orphans
            docker compose build
            docker compose up -d

