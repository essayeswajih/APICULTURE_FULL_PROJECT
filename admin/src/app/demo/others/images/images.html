<div class="container py-5">
  <!-- Image Upload Section -->
  <div class="image-upload-section">
    <h2>Upload Images</h2>
    <div class="input-group mb-3">
      <input type="file" class="form-control custom-file-input" (change)="onFileSelected($event)" accept="image/*" multiple />
      <button class="btn btn-upload" (click)="uploadImage()" [disabled]="selectedFiles.length === 0 || isUploading">
        {{ isUploading ? 'Uploading...' : 'Upload Images' }}
      </button>
    </div>

    <div *ngIf="selectedFiles.length > 0" class="selected-files">
      {{ selectedFiles.length }} image{{ selectedFiles.length > 1 ? 's' : '' }} selected
    </div>

    <div *ngIf="actionMessage" class="alert alert-success py-2" role="status">
      {{ actionMessage }}
    </div>
    <div *ngIf="actionError" class="alert alert-danger py-2" role="alert">
      {{ actionError }}
    </div>

    <!-- Upload Progress -->
    <div *ngIf="uploadProgress > 0 && uploadProgress < 100" class="upload-progress">
      <div class="progress">
        <div class="progress-bar bg-primary" role="progressbar" [style.width]="uploadProgress + '%'" [attr.aria-valuenow]="uploadProgress" aria-valuemin="0" aria-valuemax="100">
          {{ uploadProgress }}%
        </div>
      </div>
    </div>

    <!-- Uploaded Images Preview -->
    <div *ngIf="uploadedUrls.length > 0" class="preview-image">
      <p class="mb-2">Uploaded Images:</p>
      <div class="preview-grid">
        <div class="image-item preview-item" *ngFor="let uploadedUrl of uploadedUrls; let i = index">
          <img [src]="uploadedUrl" [alt]="'Uploaded image ' + (i + 1)" class="img-fluid" />
          <div class="image-actions" aria-label="Image actions">
            <button type="button" class="btn btn-light btn-sm" (click)="copyImageAddress(uploadedUrl)">Copy address</button>
            <button type="button" class="btn btn-light btn-sm" (click)="renameImage(uploadedUrl)">Rename</button>
            <button type="button" class="btn btn-danger btn-sm" (click)="deleteImage(uploadedUrl)">Delete</button>
          </div>
          <div class="image-filename" [title]="getFilename(uploadedUrl)">
            {{ getFilename(uploadedUrl) }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <hr />

  <!-- Image Gallery Section -->
  <div class="gallery-section">
    <h3>All Uploaded Images</h3>
    <div class="gallery-grid">
      <div class="image-item" *ngFor="let image of images; let i = index">
        <img [src]="image" [alt]="'Image ' + (i + 1)" loading="lazy" />
        <div class="image-actions" aria-label="Image actions">
          <button type="button" class="btn btn-light btn-sm" (click)="copyImageAddress(image)">Copy address</button>
          <button type="button" class="btn btn-light btn-sm" (click)="renameImage(image)">Rename</button>
          <button type="button" class="btn btn-danger btn-sm" (click)="deleteImage(image)">Delete</button>
        </div>
        <div class="image-filename" [title]="getFilename(image)">
          {{ getFilename(image) }}
        </div>
      </div>
    </div>
    <div *ngIf="images.length === 0" class="text-muted text-center">
      No images uploaded yet.
    </div>
  </div>
</div>
