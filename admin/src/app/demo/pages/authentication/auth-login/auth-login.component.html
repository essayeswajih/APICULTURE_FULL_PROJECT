<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a href="javascript:"><img style="max-height: 50px;" src="assets/images/logo.png" alt="logo" /></a>
      </div>
      <form class="card my-5" #loginForm="ngForm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0"><b>Login</b></h3>
            <a [routerLink]="['/register']" class="link-primary">Don't have an account?</a>
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="Email Address" [(ngModel)]="credentials.username" [ngModelOptions]="{standalone: true}" name="username" required/>
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Password" [(ngModel)]="credentials.password" [ngModelOptions]="{standalone: true}" name="password" required minlength="6" />
          </div>
          <div class="d-flex mt-1 justify-content-between">
            <div class="form-check">
              <input class="form-check-input input-primary" type="checkbox" id="customCheckc1" checked="" />
              <label class="form-check-label text-muted" for="customCheckc1">Keep me sign in</label>
            </div>
            <h5 class="text-secondary f-w-400"><a href="javascript:">Forgot Password?</a></h5>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary" (click)="login()" class="btn btn-warning w-100" [disabled]="!loginForm.valid">Login</button>
          </div>
        </div>
      </form>
      <div class="auth-footer row">
        <div class="col my-1">
          <p class="m-0">
            Copyright ©
            Wajih Essayes
          </p>
        </div>
        <div class="col-auto my-1">
          <ul class="list-inline footer-link mb-0">
            <li class="list-inline-item"><a routerLink="/">Home</a></li>
            <li class="list-inline-item"><a routerLink="/register">Register</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
