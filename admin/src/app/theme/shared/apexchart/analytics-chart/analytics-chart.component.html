<h5 class="mb-3">Analytics Report</h5>
<div class="card">
  <div class="list-group list-group-flush">
    @for (item of reportItems; track item.label) {
      <div class="list-group-item d-flex align-items-center justify-content-between gap-3">
        <div>
          <span class="d-block">{{ item.label }}</span>
          <small class="text-muted">{{ item.detail }}</small>
        </div>
        <span class="h5 mb-0 {{ item.class }}">{{ item.value }}</span>
      </div>
    }
  </div>
  <div class="card-body px-2">
    @if (isLoading) {
      <div class="text-muted text-center py-4">Loading report...</div>
    }
    <div class="chart">
      <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [xaxis]="chartOptions.xaxis"
        [colors]="chartOptions.colors"
        [stroke]="chartOptions.stroke"
        [yaxis]="chartOptions.yaxis"
        [grid]="chartOptions.grid"
        [tooltip]="chartOptions.tooltip"
        [dataLabels]="chartOptions.dataLabels"
      ></apx-chart>
    </div>
  </div>
</div>
